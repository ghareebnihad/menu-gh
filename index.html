<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=0.65, maximum-scale=5.0" />

  <title>DUHOK REST & CAFFE - Digital Menu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>

/* ==========================================================================
   DUHOK REST & CAFFE - Lüks & Minimal 60FPS Dijital Menü CSS (Full)
   ========================================================================== */

:root {
  /* Zengin Obsidyen ve Altın Paleti */
  --bg-main: #080706;
  --bg-surface: #120f0d;
  --bg-card: #181410;

  /* Şampanya Altın Vurguları */
  --accent-gold: #c5a059;
  --accent-gold-bright: #e5c378;
  --accent-gold-glow: rgba(229, 195, 120, 0.25);
  --accent-gold-muted: rgba(197, 160, 89, 0.15);

  /* Metin ve Sınır Renkleri */
  --text-primary: #f7f3ed;
  --text-muted: #a3978c;
  --border-subtle: rgba(197, 160, 89, 0.18);
  --border-gold: rgba(197, 160, 89, 0.45);

  /* Tipografi */
  --font-serif: 'Playfair Display', Georgia, serif;
  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;

  /* Ölçüler */
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;

  /* 60FPS GPU Geçişi */
  --gpu-transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), 
                    border-color 0.18s ease, 
                    background-color 0.18s ease, 
                    box-shadow 0.18s ease,
                    color 0.18s ease;
}

/* --- Temel Sıfırlama --- */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  background-color: var(--bg-main);
  color: var(--text-primary);
  font-family: var(--font-sans);
  text-rendering: optimizeSpeed;
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  background: var(--bg-main);
}

.container {
  width: 92%;
  max-width: 960px;
  margin: 0 auto;
}

/* --- Üst Bar (Header) --- */
.header {
  position: relative;
  padding: 36px 0 20px 0;
  text-align: center;
  background: var(--bg-main);
  /* Üst çizgi korundu ve %45 kalınlaştırıldı */
  border-bottom: 1.45px solid var(--border-subtle);
}

.header img,
.header::before,
.header::after {
  display: none !important;
}

/* --- Dil Seçim Modalı --- */
#language-selection {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: 
    linear-gradient(180deg, rgba(8, 7, 6, 0.85) 0%, rgba(8, 7, 6, 0.98) 100%),
    url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 9999;
  color: var(--text-primary);
  text-align: center;
  transition: opacity 0.3s ease, visibility 0.3s ease;
  padding: 24px;
}

#language-selection.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#language-selection .logo {
  font-family: var(--font-serif);
  font-size: clamp(2.2rem, 6vw, 3.2rem);
  color: var(--accent-gold-bright);
  margin-bottom: 8px;
  letter-spacing: 2px;
  text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
}

#language-selection .buttons-container {
  display: flex;
  flex-direction: column;
  gap: 26px;
  width: 100%;
  max-width: 495px;
  margin-top: 48px;
}

#language-selection button {
  height: 92px;
  padding: 0 40px;
  font-size: 1.73rem;
  border-radius: var(--radius-lg);
  cursor: pointer;
  background: rgba(24, 20, 16, 0.85);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-weight: 600;
  letter-spacing: 1.5px;
  transition: var(--gpu-transition);
  outline: none;
  touch-action: manipulation;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
}

#language-selection button:active,
#language-selection button.active {
  transform: scale(0.96);
  border-color: var(--accent-gold-bright);
  color: var(--accent-gold-bright);
  background: rgba(35, 28, 20, 0.95);
  box-shadow: 0 0 20px var(--accent-gold-glow);
}

/* --- Üst Bar Metinleri --- */
.restaurant-name {
  font-family: var(--font-serif);
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  font-weight: 700;
  color: var(--accent-gold-bright);
  letter-spacing: 2.5px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.cuisine-text {
  font-size: 0.82rem;
  color: var(--text-muted);
  margin-bottom: 16px;
  font-weight: 400;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.contact-info {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.contact-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.contact-item i {
  color: var(--accent-gold);
}

/* --- Sticky Nav (Kategori Tabları) --- */
.sticky-nav {
  position: sticky;
  top: 0;
  background: rgba(8, 7, 6, 0.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 100;
  border-bottom: none; /* Alttaki çizgi kaldırıldı */
  padding: 18px 0;
}

.menu-tabs {
  display: flex;
  overflow-x: auto;
  gap: 20px;
  padding: 4px;
  white-space: nowrap;
  scrollbar-width: none;
  align-items: center;
}

.menu-tabs::-webkit-scrollbar {
  display: none;
}

.tab-button {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 156px;
  flex-shrink: 0;
  background: none;
  color: var(--text-muted);
  border: none;
  cursor: pointer;
  transition: var(--gpu-transition);
  font-weight: 500;
  font-size: 1.42rem;
  gap: 12px;
  outline: none;
}

.tab-button .icon-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 102px;
  height: 102px;
  border-radius: var(--radius-lg);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  transition: var(--gpu-transition);
}

.tab-button i {
  font-size: 2.62rem;
  color: var(--text-muted);
  transition: var(--gpu-transition);
}

.tab-button.active {
  color: var(--accent-gold-bright);
  font-weight: 600;
}

.tab-button.active .icon-wrapper {
  background: linear-gradient(145deg, #241e17 0%, #15120e 100%);
  border-color: var(--accent-gold);
  box-shadow: 0 4px 18px rgba(197, 160, 89, 0.3);
}

.tab-button.active i {
  color: var(--accent-gold-bright);
}

/* --- Görünüm Butonları --- */
.view-controls {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin: 20px 0 16px 0;
}

body[dir="rtl"] .view-controls {
  justify-content: flex-start;
}

.view-button {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  width: 40px;
  height: 40px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  transition: var(--gpu-transition);
}

.view-button.active {
  color: var(--accent-gold-bright);
  border-color: var(--accent-gold);
  background: var(--bg-card);
  box-shadow: 0 0 12px var(--accent-gold-glow);
}

/* --- Seksiyonlar --- */
.menu-section {
  display: none;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.22s ease, transform 0.22s ease;
}

.menu-section.active {
  display: block;
  opacity: 1;
  transform: translateY(0);
}

.menu-section h2 {
  font-family: var(--font-serif);
  font-size: 1.35rem;
  color: var(--accent-gold-bright);
  margin-bottom: 18px;
  position: relative;
  padding-bottom: 6px;
  letter-spacing: 0.8px;
}

.menu-section h2::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0;
  width: 36px; height: 1.5px;
  background: var(--accent-gold-bright);
}

body[dir="rtl"] .menu-section h2::after {
  left: auto; right: 0;
}

/* --- ŞIK MİNİMAL FİYAT TASARIMI --- */
.price {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--accent-gold-bright);
  letter-spacing: 0.5px;
  background: none;
  border: none;
  padding: 0;
  white-space: nowrap;
  display: inline-block;
  text-shadow: 0 0 10px rgba(229, 195, 120, 0.25);
}

/* --- Ürün Kartları & Grid Düzeni --- */
.menu-grid {
  display: grid;
  gap: 14px;
  margin-bottom: 36px;
  width: 100%;
}

.item-image-wrapper {
  display: block;
  width: 100%;
  border-radius: var(--radius-sm);
  overflow: hidden;
  position: relative;
  background: var(--bg-surface);
}

.item-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.3s ease;
}

/* --- Grid Görünümü (2 Kolonlu) --- */
.menu-grid.grid-view-2 {
  grid-template-columns: repeat(2, 1fr);
}

.menu-grid.grid-view-2 .menu-item {
  display: flex;
  flex-direction: column;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 12px;
  transition: var(--gpu-transition);
}

.menu-grid.grid-view-2 .item-image-wrapper {
  height: 120px;
  margin-bottom: 10px;
}

.menu-grid.grid-view-2 .item-details {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  flex-grow: 1;
}

.menu-grid.grid-view-2 .item-header {
  display: flex;
  flex-direction: column;
  height: 100%;
  justify-content: space-between;
  gap: 8px;
}

.menu-grid.grid-view-2 .item-name {
  font-size: 0.92rem;
  font-weight: 500;
  color: var(--text-primary);
  line-height: 1.35;
}

.menu-grid.grid-view-2 .price {
  align-self: flex-end;
  margin-top: 4px;
}

body[dir="rtl"] .menu-grid.grid-view-2 .price {
  align-self: flex-start;
}

/* --- Liste Görünümü (Tek Kolonlu) --- */
.menu-grid.list-view {
  grid-template-columns: 1fr;
  gap: 10px;
}

.menu-grid.list-view .menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  width: 100%;
  transition: var(--gpu-transition);
}

.menu-grid.list-view .item-image-wrapper {
  width: 64px;
  height: 64px;
  flex-shrink: 0;
}

.menu-grid.list-view .item-details {
  flex-grow: 1;
}

.menu-grid.list-view .item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  gap: 12px;
}

.menu-grid.list-view .item-name {
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--text-primary);
}

/* --- Sosyal Medya & Alt Bilgi (Footer) --- */
.social-links {
  display: flex;
  gap: 26px;
  margin-top: 36px;
  justify-content: center;
}

.social-icon {
  width: 73px;
  height: 73px;
  border-radius: 50%;
  border: 1px solid var(--border-subtle);
  background: var(--bg-card);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent-gold-bright);
  font-size: 1.82rem;
  text-decoration: none;
  transition: var(--gpu-transition);
}

.menu-wrapper {
  display: none;
  flex-direction: column;
  min-height: 100vh;
  width: 100%;
}

body.lang-selected .menu-wrapper {
  display: flex;
}

main.container {
  flex: 1 0 auto;
  padding-bottom: 30px;
}

.footer {
  flex-shrink: 0;
  width: 100%;
  padding: 20px 0;
  background-color: var(--bg-surface);
  text-align: center;
  font-size: 0.78rem;
  color: var(--text-muted);
  border-top: 1px solid var(--border-subtle);
}

</style>

</head>

<body>



<div id="language-selection">

  <div class="logo">Duhok Rest & Caffee</div>



  <div class="buttons-container">

    <button data-lang="en">English</button>

    <button data-lang="ar">العربية</button>

  </div>

  <div class="social-links">

    <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>

    <a href="#" class="social-icon"><i class="fab fa-whatsapp"></i></a>

    <a href="#" class="social-icon"><i class="fab fa-snapchat"></i></a>

  </div>

</div>



<div class="menu-wrapper">

    <header class="header">

    <img src="https://resizer.otstatic.com/v3/photos/52293729-4" alt="Background" class="header-bg-img">

      <div class="container">

        <h1 class="restaurant-name" id="restaurant-name"></h1>

        <p class="cuisine-text" id="cuisine-text"></p>

        <div class="contact-info">

          <span class="contact-item" id="location-text"></span>

          <span class="contact-item" id="reservation-text"></span>

        </div>

      </div>

    </header>



    <nav class="sticky-nav">

      <div class="container">

        <div class="menu-tabs" id="menu-tabs"></div>

      </div>

    </nav>



    <main class="container">

      <div class="view-controls">

          <button class="view-button active" data-view="grid-view-2" aria-label="Grid View"><i class="fas fa-th-large"></i></button>

          <button class="view-button" data-view="list-view" aria-label="List View"><i class="fas fa-list"></i></button>

      </div>

      <div class="menu-content" id="menu-content"></div>

    </main>



    <footer class="footer">

      <div class="container">

        <p id="footer-text"></p>

      </div>

    </footer>

</div>



<script id="menu-script">

  const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRpEvyH9Kzk9aMNPhhKYzEyy2MbuMsx4qCyLwrDB0kPsqio0HWvlcIFPyQPJHTz4UJPm0eMr5X2qvWk/pub?output=csv";



  document.addEventListener("DOMContentLoaded", () => {

    const langSelection = document.getElementById("language-selection");

    const body = document.body;

    let activeView = "grid-view-2";

    let cachedData = null;



    langSelection.addEventListener("click", async (e) => {

      const btn = e.target.closest("button");

      if (!btn) return;



      document.querySelectorAll('#language-selection button').forEach(b => b.classList.remove('active'));

      btn.classList.add('active');



      const selectedLang = btn.dataset.lang;

      body.setAttribute('dir', selectedLang === 'ar' ? 'rtl' : 'ltr');

      langSelection.classList.add('hidden');

      

      try {

        if (!cachedData) {

          const response = await fetch(SHEET_URL);

          if (!response.ok) throw new Error("Veri çekilemedi.");

          const csvText = await response.text();

          cachedData = parseCSVToMenuData(csvText);

        }

        

        setTimeout(() => {

          body.classList.add('lang-selected');

          loadMenu(cachedData, selectedLang);

        }, 400);



      } catch (error) {

        console.error("Hata:", error);

        alert("Menü yüklenirken bir hata oluştu.");

      }

    });



    function parseCSVToMenuData(csvText) {

      const lines = csvText.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);

      

      const menuData = {

        "en": {

          "translations": {

            "restaurantName": "DUHOK REST & CAFFE",

            "cuisineText": "Mediterranean cuisine, premium coffee & hookah",

            "locationText": "<i class='fas fa-map-marker-alt'></i> Duhok KRO",

            "reservationText": "<i class='fas fa-phone-alt'></i> 0750 222 22 22",

            "footerText": "Developed | <strong> by Ghareeb</strong>"

          },

          "menu": {}

        },

        "ar": {

          "translations": {

            "restaurantName": "دهوك REST & CAFFE",

            "cuisineText": "مأكولات متوسطية، قهوة فاخرة وأرجيلة مميزة",

            "locationText": "<i class='fas fa-map-marker-alt'></i> دهوك KRO",

            "reservationText": "<i class='fas fa-phone-alt'></i> 0750 222 22 22",

            "footerText": "جميع الحقوق محفوظة | <strong>تم التطوير بواسطة Ghareeb</strong>"

          },

          "menu": {}

        }

      };



      for (let i = 1; i < lines.length; i++) {

        const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(item => item.replace(/^"|"$/g, '').trim());

        if (row.length < 8) continue;



        const [catId, catEn, catAr, catIcon, nameEn, nameAr, price, img] = row;

        if (!catId) continue;



        if (!menuData.en.menu[catId]) {

          menuData.en.menu[catId] = { "title": catEn, "icon": catIcon, "items": [] };

        }

        menuData.en.menu[catId].items.push({ "name": nameEn, "price": price, "img": img });



        if (!menuData.ar.menu[catId]) {

          menuData.ar.menu[catId] = { "title": catAr, "icon": catIcon, "items": [] };

        }

        menuData.ar.menu[catId].items.push({ "name": nameAr, "price": price, "img": img });

      }

      return menuData;

    }



    function loadMenu(data, lang) {

      const translations = data[lang].translations;

      const menu = data[lang].menu;



      document.getElementById("restaurant-name").textContent = translations.restaurantName;

      document.getElementById("cuisine-text").textContent = translations.cuisineText;

      document.getElementById("location-text").innerHTML = translations.locationText;

      document.getElementById("reservation-text").innerHTML = translations.reservationText;

      document.getElementById("footer-text").innerHTML = translations.footerText;



      const menuTabs = document.getElementById("menu-tabs");

      const menuContent = document.getElementById("menu-content");



      menuTabs.innerHTML = "";

      menuContent.innerHTML = "";



      Object.keys(menu).forEach((key, i) => {

        const cat = menu[key];

        const tab = document.createElement("button");

        tab.className = "tab-button";

        tab.dataset.category = key;

        tab.innerHTML = `<div class="icon-wrapper"><i class="${cat.icon}"></i></div><span>${cat.title}</span>`;

        if (i === 0) tab.classList.add("active");

        menuTabs.appendChild(tab);



        const section = document.createElement("div");

        section.id = `section-${key}`;

        section.className = "menu-section";

        if (i === 0) section.classList.add("active");

        section.innerHTML = `<h2>${cat.title}</h2><div class="menu-grid ${activeView}"></div>`;



        cat.items.forEach(item => {

          const itemDiv = document.createElement("div");

          itemDiv.className = "menu-item";

          itemDiv.innerHTML = `

            <div class="item-image-wrapper">

              <img src="${item.img}" alt="${item.name}" class="item-image" loading="lazy"/>

            </div>

            <div class="item-details">

              <div class="item-header">

                <span class="item-name">${item.name}</span>

                <span class="price">${item.price}</span>

              </div>

            </div>

          `;

          section.querySelector(".menu-grid").appendChild(itemDiv);

        });

        menuContent.appendChild(section);

      });



      document.querySelectorAll(".tab-button").forEach(btn => {

        btn.addEventListener("click", () => {

          document.querySelectorAll(".tab-button").forEach(b => b.classList.remove("active"));

          btn.classList.add("active");

          document.querySelectorAll(".menu-section").forEach(sec => sec.classList.remove("active"));

          document.getElementById(`section-${btn.dataset.category}`).classList.add("active");

          btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

        });

      });



      document.querySelectorAll(".view-button").forEach(btn => {

        btn.addEventListener("click", () => {

          document.querySelectorAll(".view-button").forEach(b => b.classList.remove("active"));

          btn.classList.add("active");

          activeView = btn.dataset.view;

          document.querySelectorAll(".menu-grid").forEach(grid => {

            grid.className = `menu-grid ${activeView}`;

          });

        });

      });

    }

  });

</script>



</body>

</html>
